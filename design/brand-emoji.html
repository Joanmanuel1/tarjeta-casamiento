<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 28px; background: var(--bg-cream); font-family: var(--modern-font); }
.row { display:flex; gap: 14px; flex-wrap: wrap; align-items:center; }
.cat { flex: 1; min-width: 180px; }
.cat .lbl { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px;}
.emojis { font-size: 24px; letter-spacing: 6px; }
</style></head>
<body>
<div class="row">
  <div class="cat"><div class="lbl">Affection</div><div class="emojis">❤️ 💌 ✨ 🎉</div></div>
  <div class="cat"><div class="lbl">Outfits</div><div class="emojis">👔 🕺 👞 👗 💃 👠</div></div>
  <div class="cat"><div class="lbl">Menu</div><div class="emojis">🍽️ 🥗 🌱 🌾 🍴</div></div>
  <div class="cat"><div class="lbl">Reaction</div><div class="emojis">😎 😢</div></div>
</div>
</body></html>
