<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 24px 28px; background: var(--bg-cream); font-family: var(--modern-font); }
.grid { display:grid; grid-template-columns: repeat(8, 1fr); gap: 14px; text-align:center; }
.item i { font-size: 22px; color: #d4a373; display:block; margin-bottom: 4px; }
.name { font-size: 10px; color: var(--text-muted); font-family: var(--mono-font); }
</style></head>
<body>
<div class="grid">
  <div class="item"><i class="pi pi-heart"></i><div class="name">heart</div></div>
  <div class="item"><i class="pi pi-calendar"></i><div class="name">calendar</div></div>
  <div class="item"><i class="pi pi-clock"></i><div class="name">clock</div></div>
  <div class="item"><i class="pi pi-map-marker"></i><div class="name">map-marker</div></div>
  <div class="item"><i class="pi pi-star"></i><div class="name">star</div></div>
  <div class="item"><i class="pi pi-music"></i><div class="name">music</div></div>
  <div class="item"><i class="pi pi-search"></i><div class="name">search</div></div>
  <div class="item"><i class="pi pi-camera"></i><div class="name">camera</div></div>
  <div class="item"><i class="pi pi-sun"></i><div class="name">sun</div></div>
  <div class="item"><i class="pi pi-car"></i><div class="name">car</div></div>
  <div class="item"><i class="pi pi-building"></i><div class="name">building</div></div>
  <div class="item"><i class="pi pi-send"></i><div class="name">send</div></div>
  <div class="item"><i class="pi pi-copy"></i><div class="name">copy</div></div>
  <div class="item"><i class="pi pi-play"></i><div class="name">play</div></div>
  <div class="item"><i class="pi pi-moon"></i><div class="name">moon</div></div>
  <div class="item"><i class="pi pi-sparkles"></i><div class="name">sparkles</div></div>
</div>
</body></html>
