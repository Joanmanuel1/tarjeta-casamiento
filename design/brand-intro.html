<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 40px; background: #0e0c0a; font-family: var(--modern-font); display:flex; align-items:center; justify-content:center; min-height: 240px; position:relative; overflow:hidden; }
.amp { position: absolute; font-family: var(--romantic-font); font-size: 380px; color: rgba(212,163,115,.06); line-height: 1; user-select:none; top: -60px; }
.content { position:relative; text-align:center; z-index: 1; }
.name { font-family: var(--romantic-font); font-size: 88px; color: #f5ede0; line-height: 1.05; margin: 0; text-shadow: 0 0 60px rgba(212,163,115,.2); }
.name2 { background: linear-gradient(135deg,#d4a373,#faedcd 60%, #d4a373); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.date { margin-top: 14px; font-size: 11px; letter-spacing: .5em; color: rgba(212,163,115,.7); font-weight: 600; text-transform: uppercase; }
</style></head>
<body>
<span class="amp">&amp;</span>
<div class="content">
  <p class="name">Joan</p>
  <p class="name name2">Stephie</p>
  <p class="date">06 · 11 · 2027</p>
</div>
</body></html>
