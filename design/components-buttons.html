<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 36px; background: var(--bg-cream); font-family: var(--modern-font); display:flex; gap: 18px; align-items:center; flex-wrap:wrap; }
.btn { border-radius: 9999px; padding: 14px 28px; font-weight: 600; letter-spacing: 0.05em; cursor: pointer; border:none; min-height: 48px; font-size: 14px; transition: all .3s ease; display:inline-flex; align-items:center; gap:8px; }
.primary { background: #d4a373; color: white; }
.primary:hover { background: #bc8a5f; transform: translateY(-2px); box-shadow: 0 15px 30px rgba(212,163,115,0.30); }
.outline { background: transparent; border: 1px solid #d4a373; color: #d4a373; }
.outline:hover { background: #d4a373; color: white; }
.nav-cta { background: #d4a373; color: white; padding: 10px 22px; min-height: 40px; font-size: 13px; letter-spacing: .08em; }
.heart { font-size: 14px; }
</style></head>
<body>
<button class="btn primary">Confirmar <span class="heart">❤️</span></button>
<button class="btn outline">📍 Cómo llegar</button>
<button class="btn nav-cta">CONFIRMAR</button>
</body></html>
