<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 20px; background: linear-gradient(135deg,#d4a373,#faedcd); font-family: var(--modern-font); display:flex; align-items:center; justify-content:center; min-height: 120px;}
.glass { background: rgba(255,255,255,.15); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.2); box-shadow: 0 20px 40px rgba(0,0,0,.1); border-radius: 2rem; padding: 14px 20px; color: white; display:flex; gap: 14px; }
.col { text-align: center; padding: 0 12px; border-left: 1px solid rgba(255,255,255,.5); }
.col:first-child { border-left:0; }
.n { font-size: 28px; font-weight: 700; line-height: 1; }
.l { font-size: 10px; text-transform: uppercase; letter-spacing: .2em; margin-top: 4px; }
</style></head>
<body>
<div class="glass">
  <div class="col"><div class="n">376</div><div class="l">Días</div></div>
  <div class="col"><div class="n">14</div><div class="l">Horas</div></div>
  <div class="col"><div class="n">22</div><div class="l">Min</div></div>
  <div class="col"><div class="n">08</div><div class="l">Seg</div></div>
</div>
</body></html>
