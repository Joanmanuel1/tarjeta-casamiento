<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 28px; background: var(--bg-cream); font-family: var(--modern-font); display:flex; gap: 18px; flex-wrap:wrap; align-items:center; }
.card { background: white; border-radius: 2rem; padding: 18px 22px; box-shadow: 0 20px 40px rgba(0,0,0,.04); border: 1px solid rgba(0,0,0,.03); flex:1; min-width: 220px; }
.label { font-size: 10px; letter-spacing: 1px; font-weight: 800; color: #aaa; display:block; }
.val { font-family: 'SFMono-Regular',Consolas,monospace; font-size: 14px; font-weight:700; color: var(--text-dark); margin-top: 4px; }
.row { display:flex; align-items:center; justify-content:space-between; gap: 12px;}
.copy { background: white; border: 1px solid #eee; padding: 8px 12px; border-radius: 12px; color: #d4a373; }
.eyebrow { font-size: 11px; letter-spacing: .35em; text-transform:uppercase; color:#d4a373; font-weight: 700; margin-bottom: 6px;}
.title { font-weight:700; font-size: 16px; margin-bottom:14px; display:flex; align-items:center; gap:10px;}
.title::before { content:'$'; width:32px; height:32px; background:#faedcd; border-radius:50%; display:flex; align-items:center; justify-content:center; color: #d4a373; font-weight: 800;}
</style></head>
<body>
<div class="card">
  <div class="title">Cuenta en Pesos</div>
  <div class="row">
    <div><span class="label">ALIAS</span><div class="val">BODA.JOAN.Y.STEPHIE</div></div>
    <button class="copy">⧉</button>
  </div>
</div>
</body></html>
