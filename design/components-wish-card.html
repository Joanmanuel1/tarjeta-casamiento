<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 28px; background: var(--bg-cream); font-family: var(--modern-font); }
.card { background: white; border-radius: 1.25rem; padding: 18px 20px; box-shadow: 0 10px 28px rgba(212,163,115,.10); border: 1px solid rgba(212,163,115,.15); max-width: 340px; }
.msg { font-size: 14px; line-height: 1.65; color: var(--text-dark); font-style: italic; margin: 0 0 14px; }
.meta { display:flex; align-items:center; gap: 10px; }
.avatar { width: 34px; height: 34px; background: #faedcd; color: #bc8a5f; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-weight: 800; font-size: 14px; }
.name { font-size: 13px; font-weight: 700; color: var(--text-dark); margin: 0;}
.date { font-size: 11px; color: var(--text-muted); margin: 0;}
</style></head>
<body>
<div class="card">
  <p class="msg">"¡Les deseo todo lo mejor! Que sean muy felices para siempre. Los quiero mucho."</p>
  <div class="meta">
    <div class="avatar">M</div>
    <div>
      <p class="name">María Inés</p>
      <p class="date">12 oct 2026</p>
    </div>
  </div>
</div>
</body></html>
