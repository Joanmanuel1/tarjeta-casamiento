<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 40px; background: var(--bg-cream); font-family: var(--modern-font); }
.wrap { display:flex; gap: 32px; flex-wrap:wrap; }
.card { background: white; width: 140px; height: 90px; border-radius: 1.25rem; display:flex; align-items:center; justify-content:center; font-size:11px; color: var(--text-muted); font-family: var(--mono-font); text-align:center; padding: 12px; }
.s-xs { box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
.s-sm { box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.s-md { box-shadow: 0 10px 25px rgba(212,163,115,0.10); }
.s-lg { box-shadow: 0 20px 40px rgba(0,0,0,0.04); }
.s-hv { box-shadow: 0 25px 60px rgba(212,163,115,0.15); }
</style></head>
<body>
<div class="wrap">
  <div class="card s-xs">shadow-xs</div>
  <div class="card s-sm">shadow-sm</div>
  <div class="card s-md">shadow-md<br>(honey-tint)</div>
  <div class="card s-lg">shadow-lg<br>(default card)</div>
  <div class="card s-hv">shadow-hover<br>(honey glow)</div>
</div>
</body></html>
