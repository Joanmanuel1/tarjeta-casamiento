<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 24px 28px; background: var(--bg-cream); font-family: var(--modern-font); }
.line { display:flex; align-items:baseline; gap: 16px; margin-bottom: 14px;}
.spec { font-size: 11px; color: var(--text-muted); font-family: var(--mono-font); min-width: 170px; flex-shrink:0; }
.eyebrow { text-transform: uppercase; letter-spacing: .35em; font-size: 12px; font-weight: 700; color: var(--primary-color); }
.h4 { font-weight: 700; font-size: 20px; color: var(--text-dark); }
.body { font-size: 16px; color: var(--text-dark); line-height: 1.65; }
.small { font-size: 13px; color: var(--text-muted); }
.xs { font-size: 11px; color: var(--text-muted); letter-spacing: .08em; }
</style></head>
<body>
<div class="line"><span class="spec">Eyebrow · 12 · tracked</span><span class="eyebrow">Para los novios</span></div>
<div class="line"><span class="spec">Montserrat 700 · 20</span><span class="h4">Para Ellas</span></div>
<div class="line"><span class="spec">Montserrat 400 · 16</span><span class="body">Escribí tu nombre arriba para empezar</span></div>
<div class="line"><span class="spec">Small muted · 13</span><span class="small">Semi-Formal / Elegante</span></div>
<div class="line"><span class="spec">Extra-small · 11</span><span class="xs">06 · 11 · 2027</span></div>
</body></html>
