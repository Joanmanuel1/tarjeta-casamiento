<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin:0; padding: 24px 28px; background: var(--bg-cream); }
.line { display:flex; align-items:baseline; gap: 16px; margin-bottom: 18px; border-bottom: 1px dashed rgba(0,0,0,.05); padding-bottom: 14px;}
.line:last-child { border-bottom: none; }
.spec { font-size: 11px; color: var(--text-muted); font-family: var(--mono-font); min-width: 140px; }
.h1 { font-family: var(--romantic-font); font-size: 72px; line-height: .9; color: var(--text-dark); }
.h2 { font-family: var(--romantic-font); font-size: 48px; line-height: 1.1; color: var(--text-dark); }
.h3 { font-family: var(--romantic-font); font-size: 32px; color: var(--text-dark); }
</style></head>
<body>
<div class="line"><span class="spec">Great Vibes · 72</span><span class="h1">Joan &amp; Stephie</span></div>
<div class="line"><span class="spec">Great Vibes · 48</span><span class="h2">Nuestra Historia</span></div>
<div class="line"><span class="spec">Great Vibes · 32</span><span class="h3">Muro de Deseos</span></div>
</body></html>
